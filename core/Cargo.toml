[package]
name = "augmented-view-core"
version = "0.6.2"
edition = "2021"
description = "Augmented View, an Obsidian plugin in Rust: WebAssembly on the main thread (Obsidian, CodeMirror) and in a worker (the engine)"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
obsidian-kit = { path = "../../shared" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
regex-lite = "0.1"
